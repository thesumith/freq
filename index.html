<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frequency Tool</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="desk">
    <div class="chassis">
      <section class="panel controls">
        <h2><span class="panel-title">Configuration</span></h2>
        <div class="form-grid">
          <div class="field">
            <label for="excelFile">Excel File</label>
            <div class="well">
              <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
            </div>
            <small>Column A: Case ID &nbsp;|&nbsp; Column B: PT(s) &nbsp;|&nbsp; Column C: IRD Date</small>
          </div>

          <div class="field">
            <label for="dlpDate">DLP Date</label>
            <div class="well">
              <input type="text" id="dlpDate" class="date-input" placeholder="dd-MMM-yyyy" inputmode="text" autocomplete="off" spellcheck="false">
            </div>
          </div>

          <div class="field">
            <label for="authDate">Date of First Authorisation of Drug</label>
            <div class="well">
              <input type="text" id="authDate" class="date-input" placeholder="dd-MMM-yyyy" inputmode="text" autocomplete="off" spellcheck="false">
            </div>
          </div>

          <div class="field">
            <label for="intervalType">Interval</label>
            <div class="well well--select">
              <select id="intervalType">
                <option value="quarterly">Quarterly</option>
                <option value="biannual">Bi-annual</option>
                <option value="yearly" selected>Yearly</option>
              </select>
            </div>
          </div>
        </div>

        <button type="button" id="processBtn" class="btn-primary" disabled>Process File</button>
        <p id="feedbackMessage" class="feedback hidden" role="status" aria-live="polite"></p>
      </section>

      <section id="intervalSection" class="panel hidden">
        <h2><span class="panel-title">Time Intervals</span></h2>
        <div id="intervalLabels" class="interval-labels"></div>
      </section>

      <section id="resultsSection" class="panel hidden">
        <div class="results-header">
          <h2><span class="panel-title">PT(s) Counts by Interval</span></h2>
          <button type="button" id="downloadBtn" class="btn-secondary">Download Excel</button>
        </div>
        <p id="yearsGrossInfo" class="years-gross-info"></p>
        <div class="results-toolbar">
          <div class="well well--search">
            <input type="search" id="ptSearch" class="search-input" placeholder="Search PT(s)…" autocomplete="off">
          </div>
          <label class="filter-check">
            <input type="checkbox" id="highlightOnlyFilter">
            <span class="toggle-face" aria-hidden="true"></span>
            Show highlighted only
          </label>
          <span id="filterSummary" class="filter-summary"></span>
        </div>
        <div class="table-frame">
          <div class="table-wrap" id="tableScroll">
            <table id="resultsTable">
              <thead id="resultsTableHead"></thead>
              <tbody id="resultsTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="js/app.js?v=12"></script>
</body>
</html>
